name: Import Wayleaf Companion APK

on:
  push:
    paths:
      - ".github/workflows/import-apk.yml"

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed APK artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7b0c-8211-9676-f46f945c9ebe/raw?se=2026-09-23T10%3A38%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=3ea641eb-3762-53ad-b728-45bf5f97b05d&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T06%3A23%3A43Z&ske=2026-09-24T06%3A23%3A43Z&sks=b&skv=2026-02-06&sig=h5VfUFWPhg8TteK07Owx0kXrWAIlFrZE1gZ0zuidoGM%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/wayleaf-release.zip
          mkdir -p /tmp/wayleaf-release
          unzip -q /tmp/wayleaf-release.zip -d /tmp/wayleaf-release
          APK="$(find /tmp/wayleaf-release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" Wayleaf-Companion-v0.3.8.apk

      - name: Publish APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayleaf-Companion-v0.3.8.apk
          git commit -m "Publish Wayleaf Companion v0.3.8 APK"
          git push
