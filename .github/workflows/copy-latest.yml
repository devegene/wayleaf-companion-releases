name: Create stable latest APK

on:
  push:
    paths:
      - ".github/workflows/copy-latest.yml"

permissions:
  contents: write

jobs:
  copy-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stable latest download
        run: |
          cp Wayleaf-Companion-v0.3.8.apk Wayleaf-Companion-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayleaf-Companion-latest.apk
          git commit -m "Add stable latest APK link"
          git push
